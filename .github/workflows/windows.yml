name: Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['windows-v*']
  pull_request:
    paths: ['Windows/**', 'Scripts/build_windows.ps1', '.github/workflows/windows.yml']
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  windows:
    name: Test and package Windows ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Core regression and real stdio tests
        run: dotnet run --project Windows/CodexProfiles.Tests -c Release
      - name: Build portable EXE and installer
        run: ./Scripts/build_windows.ps1 -Architecture ${{ matrix.arch }}
      - name: Smoke test the packaged Windows app
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $output = Join-Path $PWD 'Windows/TestResults'
          $app = Start-Process "dist/windows-x64/Codex-Profiles-windows-x64.exe" -ArgumentList @('--smoke-test', $output) -PassThru
          if (-not $app.WaitForExit(90000)) { $app.Kill(); throw 'Packaged app did not finish its smoke test' }
          Get-Content "$output/result.txt"
          if ($app.ExitCode -ne 0) { throw "Packaged app exited with $($app.ExitCode)" }
      - name: Verify silent installer and installed app
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'Codex Profiles Installed'
          $setup = Start-Process 'dist/windows-x64/Codex-Profiles-2.0.3-windows-x64-Setup.exe' -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exited with $($setup.ExitCode)" }
          $output = Join-Path $env:RUNNER_TEMP 'codex-profiles-installed-smoke'
          $app = Start-Process "$destination/Codex-Profiles.exe" -ArgumentList @('--smoke-test', $output) -PassThru
          if (-not $app.WaitForExit(90000)) { $app.Kill(); throw 'Installed app timed out' }
          Get-Content "$output/result.txt"
          if ($app.ExitCode -ne 0) { throw 'Installed app smoke test failed' }
          $uninstall = Start-Process "$destination/unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: Windows-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/windows-${{ matrix.arch }}/*.exe
            dist/windows-${{ matrix.arch }}/*.zip
            dist/windows-${{ matrix.arch }}/SHA256SUMS-*.txt
            Windows/TestResults/*.png
            Windows/TestResults/result.txt
  release:
    name: Publish Windows release
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          pattern: Windows-*
          path: release-assets
          merge-multiple: true
      - name: Publish verified installers and portable apps
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f \( -name '*.exe' -o -name '*.zip' -o -name 'SHA256SUMS-*.txt' \))
          test "${#assets[@]}" -eq 8
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --title "Codex Profiles 2.0.3 for Windows" --notes-file Windows/RELEASE_NOTES.md
